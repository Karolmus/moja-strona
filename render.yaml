services:
  - type: web
    name: deltasigma-calculators
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: >-
      python backend/init_db.py &&
      gunicorn --chdir backend
      --workers 1 --threads 4 --timeout 30
      --max-requests 1000 --max-requests-jitter 100 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CALCULATORS_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: AUTH_TOKEN_MAX_AGE
        value: "86400"
